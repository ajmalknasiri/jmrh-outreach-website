<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">A map pin with a heart, connected to shelter, food, medical care, and shower services, rising over Bay Area hills and a bridge</title>
  <defs>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff6b5f" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#c62828" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#c62828" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151515"/>
      <stop offset="1" stop-color="#211717"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1d1d"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="800" height="600" rx="24" fill="url(#sky)"/>
  <circle cx="400" cy="300" r="260" fill="url(#sun)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="70" cy="70" r="2" opacity=".5"/>
    <circle cx="260" cy="52" r="1.6" opacity=".4"/>
    <circle cx="540" cy="64" r="2" opacity=".45"/>
    <circle cx="730" cy="96" r="1.6" opacity=".5"/>
    <circle cx="90" cy="250" r="1.4" opacity=".35"/>
    <circle cx="720" cy="230" r="1.4" opacity=".35"/>
    <circle cx="300" cy="120" r="1.2" opacity=".3"/>
    <circle cx="500" cy="140" r="1.2" opacity=".3"/>
  </g>

  <!-- sun rising -->
  <path d="M290 432 A110 110 0 0 1 510 432 Z" fill="#c62828" opacity=".85"/>

  <!-- back hills -->
  <path d="M0 410 C120 360 220 380 320 400 C420 420 520 360 640 372 C710 380 760 398 800 410 L800 600 L0 600 Z" fill="#262222"/>
  <!-- water -->
  <rect x="0" y="430" width="800" height="70" fill="url(#water)"/>
  <g stroke="#ffffff" stroke-linecap="round" opacity=".14" stroke-width="3">
    <path d="M60 455h70M180 470h50M300 452h90M440 476h60M600 462h80M90 488h40M500 492h70"/>
  </g>

  <!-- bridge -->
  <g stroke="#c62828" stroke-linecap="round" fill="none">
    <path d="M500 446 H800" stroke-width="6"/>
    <path d="M560 446 V330 M700 446 V330" stroke-width="9"/>
    <path d="M560 336 h-0 M552 360 h16 M692 360 h16 M552 395 h16 M692 395 h16" stroke-width="4"/>
    <path d="M500 420 Q530 400 560 334 Q630 440 700 334 Q735 400 800 404" stroke-width="3"/>
    <g stroke-width="1.5" opacity=".8">
      <path d="M580 366 V446 M600 392 V446 M620 410 V446 M640 410 V446 M660 392 V446 M680 366 V446"/>
      <path d="M520 410 V446 M540 386 V446 M720 380 V446 M740 392 V446 M760 400 V446 M780 403 V446"/>
    </g>
  </g>

  <!-- front hills -->
  <path d="M0 500 C140 470 260 478 380 500 C500 522 620 480 800 492 L800 600 L0 600 Z" fill="#2f2a2a"/>
  <path d="M0 548 C160 528 300 540 420 556 C560 574 680 540 800 548 L800 600 L0 600 Z" fill="#3a3333"/>

  <!-- connecting routes -->
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12" opacity=".7">
    <path d="M176 168 C260 160 320 190 372 228"/>
    <path d="M156 332 C240 330 320 300 368 268"/>
    <path d="M624 168 C540 160 480 190 428 228"/>
    <path d="M592 298 C530 300 470 290 432 268"/>
  </g>

  <!-- service badges -->
  <g filter="url(#soft)">
    <circle cx="150" cy="168" r="44" fill="#ffffff"/>
    <circle cx="130" cy="332" r="44" fill="#ffffff"/>
    <circle cx="650" cy="168" r="44" fill="#ffffff"/>
    <circle cx="636" cy="296" r="44" fill="#ffffff"/>
  </g>
  <g fill="none" stroke="#c62828" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- shelter -->
    <g transform="translate(130 148) scale(1.67)">
      <path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/>
    </g>
    <!-- food -->
    <g transform="translate(110 312) scale(1.67)">
      <path d="M7 2v8a2 2 0 0 0 2 2v10"/><path d="M11 2v8a2 2 0 0 1-2 2"/><path d="M17 22V2c-2 1-3 3.5-3 7v4h3"/>
    </g>
    <!-- medical -->
    <g transform="translate(630 148) scale(1.67)">
      <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v8M8 12h8"/>
    </g>
    <!-- showers / hygiene -->
    <g transform="translate(616 276) scale(1.67)">
      <path d="M12 2.7l5.7 5.6a8 8 0 1 1-11.4 0z"/>
    </g>
  </g>

  <!-- central pin -->
  <ellipse cx="400" cy="384" rx="46" ry="9" fill="#000" opacity=".45"/>
  <g filter="url(#soft)">
    <path d="M400 376 C384 352 322 300 322 246 A78 78 0 1 1 478 246 C478 300 416 352 400 376 Z" fill="#ffffff"/>
  </g>
  <circle cx="400" cy="246" r="52" fill="#c62828"/>
  <path transform="translate(369.2 217.2) scale(2.6)" fill="#ffffff"
        d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.8 0-3 .5-4.5 2-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>
</svg>
